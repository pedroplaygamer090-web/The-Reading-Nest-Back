spring.application.name=the-reading-nest-back

# Usa a porta fornecida pela plataforma ou 8080 no desenvolvimento local.
server.port=${PORT:8080}

# Conexao com o MySQL (schema the-reading-nest_db)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/the-reading-nest_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Executa schema.sql em cada inicializacao; o script usa IF NOT EXISTS e INSERT IGNORE
spring.sql.init.mode=always

# Virtual Threads do Java 25
spring.threads.virtual.enabled=true

# Paginacao global padronizada (padrao 30, maximo 100 - Regra M1 do REVIEW.md)
spring.data.web.pageable.default-page-size=30
spring.data.web.pageable.max-page-size=100

# Configuracoes de seguranca para geracao e validacao de tokens JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
